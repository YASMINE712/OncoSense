<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">Mammography machine-learning workflow</title>
  <desc id="desc">A high-level workflow from restricted imaging data to metadata manifests, preprocessing, model training, and experiment artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102c3d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24c6b4"/><stop offset="1" stop-color="#50a7ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020814" flood-opacity=".42"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#70abc1"/></marker>
  </defs>
  <rect width="1200" height="530" fill="url(#bg)" rx="28"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f1f8fb">From restricted imaging assets to ML experiment evidence</text>
  <text x="70" y="113" font-family="Arial, sans-serif" font-size="18" fill="#a8c6d5">A high-level portfolio view — private code, data, and weights stay outside this repository.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="202" height="184" rx="18" fill="#123247" stroke="#2e6f89"/><rect x="306" y="190" width="202" height="184" rx="18" fill="#123247" stroke="#2e6f89"/><rect x="542" y="190" width="202" height="184" rx="18" fill="#123247" stroke="#2e6f89"/><rect x="778" y="190" width="202" height="184" rx="18" fill="#123247" stroke="#2e6f89"/><rect x="1014" y="190" width="116" height="184" rx="18" fill="#123247" stroke="#2e6f89"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="109" cy="228" r="20" fill="url(#accent)"/><text x="102" y="235" font-size="18" font-weight="700" fill="#06131f">1</text><text x="98" y="278" font-size="22" font-weight="700" fill="#f3fbff">Restricted</text><text x="98" y="306" font-size="22" font-weight="700" fill="#f3fbff">imaging data</text><text x="98" y="339" font-size="15" fill="#add1df">Images and source</text><text x="98" y="360" font-size="15" fill="#add1df">annotation records</text>
    <circle cx="345" cy="228" r="20" fill="url(#accent)"/><text x="338" y="235" font-size="18" font-weight="700" fill="#06131f">2</text><text x="334" y="278" font-size="22" font-weight="700" fill="#f3fbff">Data</text><text x="334" y="306" font-size="22" font-weight="700" fill="#f3fbff">manifests</text><text x="334" y="339" font-size="15" fill="#add1df">Paths, labels, splits,</text><text x="334" y="360" font-size="15" fill="#add1df">and image roles</text>
    <circle cx="581" cy="228" r="20" fill="url(#accent)"/><text x="574" y="235" font-size="18" font-weight="700" fill="#06131f">3</text><text x="570" y="278" font-size="22" font-weight="700" fill="#f3fbff">Preprocess</text><text x="570" y="306" font-size="22" font-weight="700" fill="#f3fbff">and load</text><text x="570" y="339" font-size="15" fill="#add1df">Resize, normalize,</text><text x="570" y="360" font-size="15" fill="#add1df">tensor conversion</text>
    <circle cx="817" cy="228" r="20" fill="url(#accent)"/><text x="810" y="235" font-size="18" font-weight="700" fill="#06131f">4</text><text x="806" y="278" font-size="22" font-weight="700" fill="#f3fbff">Train</text><text x="806" y="306" font-size="22" font-weight="700" fill="#f3fbff">models</text><text x="806" y="339" font-size="15" fill="#add1df">Transfer learning,</text><text x="806" y="360" font-size="15" fill="#add1df">weighted loss</text>
    <circle cx="1053" cy="228" r="20" fill="url(#accent)"/><text x="1046" y="235" font-size="18" font-weight="700" fill="#06131f">5</text><text x="1034" y="278" font-size="22" font-weight="700" fill="#f3fbff">Run</text><text x="1034" y="306" font-size="22" font-weight="700" fill="#f3fbff">artifacts</text><text x="1034" y="339" font-size="15" fill="#add1df">Metrics and</text><text x="1034" y="360" font-size="15" fill="#add1df">curves</text>
  </g>
  <g stroke="#70abc1" stroke-width="3" marker-end="url(#arrow)"><path d="M272 282H296"/><path d="M508 282H532"/><path d="M744 282H768"/><path d="M980 282H1004"/></g>
  <rect x="70" y="427" width="1060" height="44" rx="12" fill="#0b2132" stroke="#234b62"/><text x="96" y="456" font-family="Arial, sans-serif" font-size="17" fill="#b8d9e5">Portfolio focus: data preparation • computer vision • transfer learning • training discipline • experiment traceability</text>
</svg>
