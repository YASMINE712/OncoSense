<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">OncoSense breast cancer computer vision workflow</title>
  <desc id="description">A clean architecture diagram of two experimental paths: CNN classification and lesion localisation with crop preparation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071625"/>
      <stop offset="1" stop-color="#112e42"/>
    </linearGradient>
    <linearGradient id="classification" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6384f6"/>
      <stop offset="1" stop-color="#8b6df0"/>
    </linearGradient>
    <linearGradient id="detection" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#28c5af"/>
      <stop offset="1" stop-color="#55d58c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#01070d" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L9,4 z" fill="#9bcce0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>

  <text x="88" y="86" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#f4f9fc">OncoSense</text>
  <text x="88" y="126" font-family="Arial, sans-serif" font-size="23" fill="#b8d5e2">Breast-cancer computer-vision workflow</text>
  <text x="88" y="164" font-family="Arial, sans-serif" font-size="17" fill="#85aebe">From model-ready records to classification or lesion-localisation experiments.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="88" y="220" width="300" height="150" rx="18" fill="#15364b" stroke="#4385a1"/>
    <text x="116" y="266" font-size="20" font-weight="700" fill="#eff8fc">1. Approved source data</text>
    <text x="116" y="302" font-size="17" fill="#c1dbe5">Mammography PNG files</text>
    <text x="116" y="330" font-size="17" fill="#c1dbe5">Metadata and pathology labels</text>
    <text x="116" y="358" font-size="17" fill="#c1dbe5">Lesion masks</text>

    <rect x="510" y="220" width="360" height="150" rx="18" fill="#15364b" stroke="#4385a1"/>
    <text x="538" y="266" font-size="20" font-weight="700" fill="#eff8fc">2. Manifest and preparation</text>
    <text x="538" y="302" font-size="17" fill="#c1dbe5">Path and metadata resolution</text>
    <text x="538" y="330" font-size="17" fill="#c1dbe5">Image and mask linkage</text>
    <text x="538" y="358" font-size="17" fill="#c1dbe5">Model-ready records</text>
  </g>
  <path d="M388 295 H490" stroke="#9bcce0" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M690 370 V422 H420 V472" fill="none" stroke="#9bcce0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M690 370 V422 H1190 V472" fill="none" stroke="#9bcce0" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="70" y="462" width="700" height="310" rx="24" fill="#102c42" stroke="#668fe8" stroke-width="2"/>
  <rect x="830" y="462" width="700" height="310" rx="24" fill="#103b35" stroke="#50c89d" stroke-width="2"/>
  <text x="106" y="514" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f9fc">A. Binary classification</text>
  <text x="106" y="544" font-family="Arial, sans-serif" font-size="16" fill="#b9cee0">Manifest-selected image to a benign / malignant experimental label</text>
  <text x="866" y="514" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#f4f9fc">B. Lesion localisation and crop preparation</text>
  <text x="866" y="544" font-family="Arial, sans-serif" font-size="16" fill="#b9d9d0">Full mammogram and mask to bounding box and contextual crop</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="106" y="588" width="184" height="130" rx="16" fill="url(#classification)"/>
    <text x="128" y="627" font-size="18" font-weight="700" fill="#081321">Image preparation</text>
    <text x="128" y="658" font-size="15" fill="#081321">RGB conversion</text>
    <text x="128" y="682" font-size="15" fill="#081321">224 x 224 resize</text>
    <text x="128" y="706" font-size="15" fill="#081321">ImageNet normalisation</text>

    <rect x="328" y="588" width="184" height="130" rx="16" fill="url(#classification)"/>
    <text x="350" y="627" font-size="18" font-weight="700" fill="#081321">Transfer learning</text>
    <text x="350" y="658" font-size="15" fill="#081321">ResNet50</text>
    <text x="350" y="682" font-size="15" fill="#081321">VGG16</text>
    <text x="350" y="706" font-size="15" fill="#081321">DenseNet121</text>

    <rect x="550" y="588" width="184" height="130" rx="16" fill="url(#classification)"/>
    <text x="572" y="627" font-size="18" font-weight="700" fill="#081321">Training control</text>
    <text x="572" y="658" font-size="15" fill="#081321">Weighted loss</text>
    <text x="572" y="682" font-size="15" fill="#081321">F1 checkpointing</text>
    <text x="572" y="706" font-size="15" fill="#081321">Early stopping</text>

    <rect x="866" y="588" width="184" height="130" rx="16" fill="url(#detection)"/>
    <text x="888" y="627" font-size="18" font-weight="700" fill="#071a17">Target creation</text>
    <text x="888" y="658" font-size="15" fill="#071a17">Full image and mask</text>
    <text x="888" y="682" font-size="15" fill="#071a17">Mask-derived box</text>
    <text x="888" y="706" font-size="15" fill="#071a17">Lesion target</text>

    <rect x="1088" y="588" width="184" height="130" rx="16" fill="url(#detection)"/>
    <text x="1110" y="627" font-size="18" font-weight="700" fill="#071a17">Faster R-CNN</text>
    <text x="1110" y="658" font-size="15" fill="#071a17">ResNet50-FPN</text>
    <text x="1110" y="682" font-size="15" fill="#071a17">H flip: p = 0.5</text>
    <text x="1110" y="706" font-size="15" fill="#071a17">V flip: p = 0.5</text>

    <rect x="1310" y="588" width="184" height="130" rx="16" fill="url(#detection)"/>
    <text x="1332" y="627" font-size="18" font-weight="700" fill="#071a17">Crop preparation</text>
    <text x="1332" y="658" font-size="15" fill="#071a17">Expand lesion box</text>
    <text x="1332" y="682" font-size="15" fill="#071a17">35% tissue context</text>
    <text x="1332" y="706" font-size="15" fill="#071a17">Contextual crop output</text>
  </g>

  <g stroke="#b8dce9" stroke-width="3" marker-end="url(#arrow)">
    <path d="M290 653 H316"/>
    <path d="M512 653 H538"/>
    <path d="M1050 653 H1076"/>
    <path d="M1272 653 H1298"/>
  </g>

  <rect x="70" y="816" width="1460" height="42" rx="12" fill="#0a2233" stroke="#315d73"/>
  <text x="98" y="843" font-family="Arial, sans-serif" font-size="17" fill="#d2e6ee">Portfolio evidence: manifest engineering, data linkage, transfer learning, target-aware augmentation, checkpoints and explicit experimental boundaries.</text>
</svg>
